# Nudge rules for Rust code style enforcement.
#
# These rules demonstrate how to convert common Rust coding guidelines
# into Nudge rule definitions. Copy and adapt for your projects.

version: 1

rules:
  # Catch `use` statements inside function/closure bodies.
  # Uses tree-sitter to distinguish block-level imports from module-level imports.
  - name: no-inline-imports
    description: Move imports to the top of the file
    message: Move this `use` statement to the top of the file with other imports, then retry.
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (block (use_declaration) @use)
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (block (use_declaration) @use)

  # Catch left-hand side type annotations in variable declarations.
  # Uses tree-sitter to match `let name: Type = ...` without false positives
  # from pattern matching like `let Value::Object(x) = ...`.
  - name: no-lhs-type-annotations
    description: Use type inference or turbofish instead of LHS annotations
    message: "Use turbofish syntax (e.g., `from_str::<Type>(...)`) or type inference instead of left-hand type annotations, then retry."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (let_declaration type: (_) @type)
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (let_declaration type: (_) @type)

  # Prefer explicit string construction for string literals.
  # Uses tree-sitter to match literal receiver calls while ignoring variables.
  - name: prefer-string-from-literal
    description: Use String::from instead of .to_string() on string literals
    message: 'Use `String::from("...")` instead of calling `.to_string()` on a string literal, then retry.'
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (call_expression
                function: (field_expression
                  value: (string_literal) @string
                  field: (field_identifier) @method
                  (#eq? @method "to_string"))
                arguments: (arguments))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (call_expression
                function: (field_expression
                  value: (string_literal) @string
                  field: (field_identifier) @method
                  (#eq? @method "to_string"))
                arguments: (arguments))

  # Catch unnecessarily fully qualified paths in code (not imports).
  # Pattern: paths with 2+ `::` separators followed by ::, (, or <
  - name: no-qualified-paths
    description: Simplify qualified paths by adding imports
    message: "Simplify this path by adding a `use` import at file top, then retry. Exception: keep qualified if it improves clarity."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: Regex
            pattern: "std(::[a-zA-Z_][a-zA-Z0-9_]*){2,}(::|\\(|<)"
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: Regex
            pattern: "std(::[a-zA-Z_][a-zA-Z0-9_]*){2,}(::|\\(|<)"

  # Suggest using `pretty_assertions` for better test output.
  # Uses tree-sitter to match the exact macro name, avoiding false positives
  # from `pretty_assert_eq!` which contains `assert_eq` as a substring.
  - name: prefer-pretty-assertions
    description: Use pretty_assertions in tests for better diff output
    message: "Use `pretty_assert_eq!` instead. Add `use pretty_assertions::assert_eq as pretty_assert_eq;` at file top, then retry."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (macro_invocation
                macro: (identifier) @macro
                (#eq? @macro "assert_eq"))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (macro_invocation
                macro: (identifier) @macro
                (#eq? @macro "assert_eq"))

  # Catch .unwrap() calls and suggest .expect() instead.
  # Uses tree-sitter to match actual method calls, avoiding false positives
  # from doc comments or string literals containing ".unwrap()".
  - name: no-unwrap
    description: Use .expect() instead of .unwrap() for better error messages
    message: 'Use `.expect("descriptive error message")` instead of `.unwrap()`, then retry.'
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (call_expression
                function: (field_expression
                  field: (field_identifier) @method
                  (#eq? @method "unwrap"))
                arguments: (arguments))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (call_expression
                function: (field_expression
                  field: (field_identifier) @method
                  (#eq? @method "unwrap"))
                arguments: (arguments))

  # Catch a state check with an early exit followed by an unwrap of the same value:
  #   if value.is_none() { return ...; }  let value = value.unwrap();
  # Also matches `is_err()`, `!is_some()`, `!is_ok()`, `.expect(...)`, and
  # `break`/`continue` exits. The `.` anchor requires the `let` to be the next
  # statement, and `#eq?` requires the checked and unwrapped values to match.
  - name: prefer-let-else-over-check-unwrap
    description: Use let-else instead of checking is_none/is_err and then unwrapping
    message: "Replace the `if {{ $condition }}` guard and the `.{{ $unwrap }}()` after it with `let Some(..) = {{ $receiver }} else { ... };` (use `let Ok(..)` or `match` for a `Result`), then retry."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (block
                (expression_statement
                  (if_expression
                    condition: [
                      (call_expression
                        function: (field_expression
                          value: [(identifier) (field_expression)] @receiver
                          field: (field_identifier) @check))
                      (unary_expression "!"
                        (call_expression
                          function: (field_expression
                            value: [(identifier) (field_expression)] @receiver
                            field: (field_identifier) @negated_check)))
                    ] @condition
                    consequence: (block
                      [(expression_statement [(return_expression) (break_expression) (continue_expression)])
                       (return_expression) (break_expression) (continue_expression)] .)
                    !alternative))
                .
                (let_declaration
                  value: (call_expression
                    function: (field_expression
                      value: (_) @unwrapped
                      field: (field_identifier) @unwrap)))
                (#any-of? @check "is_none" "is_err")
                (#any-of? @negated_check "is_some" "is_ok")
                (#any-of? @unwrap "unwrap" "expect")
                (#eq? @receiver @unwrapped))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (block
                (expression_statement
                  (if_expression
                    condition: [
                      (call_expression
                        function: (field_expression
                          value: [(identifier) (field_expression)] @receiver
                          field: (field_identifier) @check))
                      (unary_expression "!"
                        (call_expression
                          function: (field_expression
                            value: [(identifier) (field_expression)] @receiver
                            field: (field_identifier) @negated_check)))
                    ] @condition
                    consequence: (block
                      [(expression_statement [(return_expression) (break_expression) (continue_expression)])
                       (return_expression) (break_expression) (continue_expression)] .)
                    !alternative))
                .
                (let_declaration
                  value: (call_expression
                    function: (field_expression
                      value: (_) @unwrapped
                      field: (field_identifier) @unwrap)))
                (#any-of? @check "is_none" "is_err")
                (#any-of? @negated_check "is_some" "is_ok")
                (#any-of? @unwrap "unwrap" "expect")
                (#eq? @receiver @unwrapped))

  # Redirect docs.rs fetches to local cargo registry.
  # Demonstrates the WebFetch matcher with URL capture groups.
  - name: prefer-local-docs
    description: Read local crate source instead of fetching from docs.rs
    message: "{{ $suggestion }}"
    on:
      - hook: PreToolUse
        tool: WebFetch
        url:
          - kind: Regex
            pattern: "docs\\.rs/(?P<crate>[^/]+)"
            suggestion: "Don't fetch from docs.rs. Instead, read the local source at ~/.cargo/registry/src/*/{{ $crate }}-*"
