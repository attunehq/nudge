# Nudge rules for Rust code style enforcement.
#
# These rules demonstrate how to convert common Rust coding guidelines
# into Nudge rule definitions. Copy and adapt for your projects.

version: 1

rules:
  # Catch `use` statements inside function/closure bodies.
  # Uses tree-sitter to distinguish block-level imports from module-level imports.
  - name: no-inline-imports
    description: Move imports to the top of the file
    message: Move this `use` statement to the top of the file with other imports, then retry.
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (block (use_declaration) @use)
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (block (use_declaration) @use)

  # Catch left-hand side type annotations in variable declarations.
  # Uses tree-sitter to match `let name: Type = ...` without false positives
  # from pattern matching like `let Value::Object(x) = ...`.
  - name: no-lhs-type-annotations
    description: Use type inference or turbofish instead of LHS annotations
    message: "Use turbofish syntax (e.g., `from_str::<Type>(...)`) or type inference instead of left-hand type annotations, then retry."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (let_declaration type: (_) @type)
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (let_declaration type: (_) @type)

  # Prefer explicit string construction for string literals.
  # Uses tree-sitter to match literal receiver calls while ignoring variables.
  - name: prefer-string-from-literal
    description: Use String::from instead of .to_string() on string literals
    message: 'Use `String::from("...")` instead of calling `.to_string()` on a string literal, then retry.'
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (call_expression
                function: (field_expression
                  value: (string_literal) @string
                  field: (field_identifier) @method
                  (#eq? @method "to_string"))
                arguments: (arguments))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (call_expression
                function: (field_expression
                  value: (string_literal) @string
                  field: (field_identifier) @method
                  (#eq? @method "to_string"))
                arguments: (arguments))

  # Catch unnecessarily fully qualified paths in code (not imports).
  # Pattern: paths with 2+ `::` separators followed by ::, (, or <
  - name: no-qualified-paths
    description: Simplify qualified paths by adding imports
    message: "Simplify this path by adding a `use` import at file top, then retry. Exception: keep qualified if it improves clarity."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: Regex
            pattern: "std(::[a-zA-Z_][a-zA-Z0-9_]*){2,}(::|\\(|<)"
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: Regex
            pattern: "std(::[a-zA-Z_][a-zA-Z0-9_]*){2,}(::|\\(|<)"

  # Suggest using `pretty_assertions` for better test output.
  # Uses tree-sitter to match the exact macro name, avoiding false positives
  # from `pretty_assert_eq!` which contains `assert_eq` as a substring.
  - name: prefer-pretty-assertions
    description: Use pretty_assertions in tests for better diff output
    message: "Use `pretty_assert_eq!` instead. Add `use pretty_assertions::assert_eq as pretty_assert_eq;` at file top, then retry."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (macro_invocation
                macro: (identifier) @macro
                (#eq? @macro "assert_eq"))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (macro_invocation
                macro: (identifier) @macro
                (#eq? @macro "assert_eq"))

  # Catch .unwrap() calls and suggest .expect() instead.
  # Uses tree-sitter to match actual method calls, avoiding false positives
  # from doc comments or string literals containing ".unwrap()".
  - name: no-unwrap
    description: Use .expect() instead of .unwrap() for better error messages
    message: 'Use `.expect("descriptive error message")` instead of `.unwrap()`, then retry.'
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (call_expression
                function: (field_expression
                  field: (field_identifier) @method
                  (#eq? @method "unwrap"))
                arguments: (arguments))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (call_expression
                function: (field_expression
                  field: (field_identifier) @method
                  (#eq? @method "unwrap"))
                arguments: (arguments))

  # Catch a state check with an early exit followed by an unwrap of the same value:
  #   if value.is_none() { return ...; }  let value = value.unwrap();
  # Also matches `is_err()`, `!is_some()`, `!is_ok()`, `.expect(...)`, and
  # `break`/`continue` exits. The `.` anchor requires the `let` to be the next
  # statement, and `#eq?` requires the checked and unwrapped values to match.
  # Comments may sit after the exit; the `"}"` anchor still requires the exit
  # to be the guard's last statement. Comments and attributes such as
  # `#[allow(clippy::unwrap_used)]` may sit between the guard and the `let`.
  # The guard and the `let` are a top-level sibling group with no parent node.
  # For a single replacement, an Edit's `new_content` may be only the
  # replacement text, a few lines from inside a function. Those lines parse
  # under `source_file`, which `(block` misses, or under an `ERROR` node when
  # they do not parse cleanly, which `(_` misses.
  #
  # Limits: this is a pattern match, not data-flow analysis. It does not match
  # an unwrap that is not the whole `let` value (`let n = a.unwrap().len();`),
  # an unwrap through an adapter (`let a = self.a.as_ref().unwrap();`), an
  # unwrap outside a `let` (`foo(a.unwrap())`), other statements between the
  # guard and the `let`, or exits through macros such as `bail!` or `panic!`.
  # It also skips receivers whose path contains a call (`it.next().unwrap().v`),
  # since the guard and the `let` may then read different values; receivers
  # with raw or non-ASCII identifiers or whitespace inside the path; guards
  # whose body contains an attribute, since `#[cfg(..)] return` may not exit;
  # and `cfg` attributes between the guard and the `let`. A `#[cfg(..)]` on
  # the guard statement itself still matches: a query cannot rule out a
  # preceding sibling.
  - name: prefer-let-else-over-check-unwrap
    description: Use let-else instead of checking is_none/is_err and then unwrapping
    message: "Replace the `if {{ $condition }}` guard and the `.{{ $unwrap }}()` after it with a let-else that binds the value of `{{ $receiver }}` and moves the guard's body into its `else` block, then retry."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (
                (expression_statement
                  (if_expression
                    condition: [
                      (call_expression
                        function: (field_expression
                          value: [(identifier) (field_expression)] @receiver
                          field: (field_identifier) @check))
                      (unary_expression "!"
                        (call_expression
                          function: (field_expression
                            value: [(identifier) (field_expression)] @receiver
                            field: (field_identifier) @negated_check)))
                    ] @condition
                    consequence: (block
                      [(expression_statement [(return_expression) (break_expression) (continue_expression)])
                       (return_expression) (break_expression) (continue_expression)]
                      .
                      [(line_comment) (block_comment)]*
                      .
                      "}") @body
                    !alternative))
                .
                [(line_comment) (block_comment) (attribute_item) @between_attribute]*
                .
                (let_declaration
                  value: (call_expression
                    function: (field_expression
                      value: (_) @unwrapped
                      field: (field_identifier) @unwrap)))
                (#any-of? @check "is_none" "is_err")
                (#any-of? @negated_check "is_some" "is_ok")
                (#any-of? @unwrap "unwrap" "expect")
                (#eq? @receiver @unwrapped)
                (#match? @receiver "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z0-9_]+)*$")
                (#not-match? @body "#!?\\[")
                (#not-match? @between_attribute "cfg"))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (
                (expression_statement
                  (if_expression
                    condition: [
                      (call_expression
                        function: (field_expression
                          value: [(identifier) (field_expression)] @receiver
                          field: (field_identifier) @check))
                      (unary_expression "!"
                        (call_expression
                          function: (field_expression
                            value: [(identifier) (field_expression)] @receiver
                            field: (field_identifier) @negated_check)))
                    ] @condition
                    consequence: (block
                      [(expression_statement [(return_expression) (break_expression) (continue_expression)])
                       (return_expression) (break_expression) (continue_expression)]
                      .
                      [(line_comment) (block_comment)]*
                      .
                      "}") @body
                    !alternative))
                .
                [(line_comment) (block_comment) (attribute_item) @between_attribute]*
                .
                (let_declaration
                  value: (call_expression
                    function: (field_expression
                      value: (_) @unwrapped
                      field: (field_identifier) @unwrap)))
                (#any-of? @check "is_none" "is_err")
                (#any-of? @negated_check "is_some" "is_ok")
                (#any-of? @unwrap "unwrap" "expect")
                (#eq? @receiver @unwrapped)
                (#match? @receiver "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z0-9_]+)*$")
                (#not-match? @body "#!?\\[")
                (#not-match? @between_attribute "cfg"))

  # Catch a fresh Vec filled by a `for` loop that only pushes to it:
  #   let mut results = Vec::new();  for x in xs { results.push(f(x)); }
  # Also matches `Vec::with_capacity(..)` and `vec![]`, and a loop body that
  # is a single `if` or `if let` (without `else`) whose block only pushes;
  # those become `.filter(..)` and `.filter_map(..)`. The `.` anchors require
  # the loop to be the statement right after the `let`, and the `"{"` and
  # `"}"` anchors require the push to be the only statement in each block.
  # Comments may sit between the `let` and the loop and around the push.
  # Like the let-else rule, the `let` and the loop are a top-level sibling
  # group, so the query also matches an Edit snippet without a function.
  #
  # Limits: this is a pattern match, not data-flow analysis, so it trades
  # missed loops for no false blocks. It does not match loops with other
  # statements, several pushes, `while`/`loop`, an `else` branch, other
  # collections (`String`, `HashMap`), or other statements between the `let`
  # and the loop. It skips loop bodies an iterator chain cannot express:
  # `.await`, `break`/`continue`/`return` (closures cannot exit the loop), a
  # `?` in the `if` condition (a `filter` closure returns `bool`), and
  # attributes, since `#[cfg(..)]` may remove the push. A query cannot tell
  # whether the body reads the Vec it builds (`if !seen.contains(&x)`,
  # `sums.last()`), so it skips any body calling a common read method
  # (`contains`, `first`, `last`, `len`, `is_empty`, `get`, `iter`,
  # `binary_search`), on any receiver. It still matches when the Vec is pushed
  # to again after the loop (the message says to keep `mut`), when the
  # iterable reads the Vec (`for _ in 0..v.capacity()`), when an `if let`
  # shadows the Vec's name, and when a push loop is kept on purpose. A sweep
  # of 604 crates found 113 matches before the read-method and exit
  # exclusions; a 30-match sample had one deliberate loop and one loop whose
  # iterable read the Vec.
  - name: prefer-collect-over-push-loop
    description: Collect an iterator chain instead of pushing to a new Vec in a for loop
    message: "Build `{{ $collection }}` by collecting an iterator over `{{ $iterable }}` instead of pushing to it in a `for` loop (`.map(..)`, `.filter(..)`, or `.filter_map(..)`, then `.collect::<Vec<_>>()`, or `.collect::<Result<Vec<_>, _>>()?` (`Option<Vec<_>>` for an `Option`) when the pushed value uses `?`; keep `mut` only if you push to it again later), then retry."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (
                (let_declaration
                  (mutable_specifier)
                  pattern: (identifier) @collection
                  value: [
                    (call_expression
                      function: (scoped_identifier
                        path: (identifier) @vec_type
                        name: (identifier) @constructor))
                    (macro_invocation
                      macro: (identifier) @vec_macro
                      (token_tree) @vec_tokens)
                  ])
                .
                [(line_comment) (block_comment)]*
                .
                (expression_statement
                  (for_expression
                    value: (_) @iterable
                    body: (block
                      "{"
                      .
                      [(line_comment) (block_comment)]*
                      .
                      [
                        (expression_statement
                          (call_expression
                            function: (field_expression
                              value: (identifier) @pushed
                              field: (field_identifier) @push)
                            arguments: (arguments (_))))
                        (call_expression
                          function: (field_expression
                            value: (identifier) @pushed
                            field: (field_identifier) @push)
                          arguments: (arguments (_)))
                        (expression_statement
                          (if_expression
                            condition: (_) @condition
                            consequence: (block
                              "{"
                              .
                              [(line_comment) (block_comment)]*
                              .
                              [
                                (expression_statement
                                  (call_expression
                                    function: (field_expression
                                      value: (identifier) @pushed
                                      field: (field_identifier) @push)
                                    arguments: (arguments (_))))
                                (call_expression
                                  function: (field_expression
                                    value: (identifier) @pushed
                                    field: (field_identifier) @push)
                                  arguments: (arguments (_)))
                              ]
                              .
                              [(line_comment) (block_comment)]*
                              .
                              "}")
                            !alternative))
                      ]
                      .
                      [(line_comment) (block_comment)]*
                      .
                      "}") @body))
                (#eq? @vec_type "Vec")
                (#any-of? @constructor "new" "with_capacity")
                (#eq? @vec_macro "vec")
                (#eq? @vec_tokens "[]")
                (#eq? @push "push")
                (#eq? @pushed @collection)
                (#not-match? @body "\\.await|#!?\\[|\\b(break|continue|return)\\b")
                (#not-match? @body "\\.(contains|first|last|last_mut|len|is_empty|get|iter|binary_search)\\(")
                (#not-match? @condition "\\?"))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (
                (let_declaration
                  (mutable_specifier)
                  pattern: (identifier) @collection
                  value: [
                    (call_expression
                      function: (scoped_identifier
                        path: (identifier) @vec_type
                        name: (identifier) @constructor))
                    (macro_invocation
                      macro: (identifier) @vec_macro
                      (token_tree) @vec_tokens)
                  ])
                .
                [(line_comment) (block_comment)]*
                .
                (expression_statement
                  (for_expression
                    value: (_) @iterable
                    body: (block
                      "{"
                      .
                      [(line_comment) (block_comment)]*
                      .
                      [
                        (expression_statement
                          (call_expression
                            function: (field_expression
                              value: (identifier) @pushed
                              field: (field_identifier) @push)
                            arguments: (arguments (_))))
                        (call_expression
                          function: (field_expression
                            value: (identifier) @pushed
                            field: (field_identifier) @push)
                          arguments: (arguments (_)))
                        (expression_statement
                          (if_expression
                            condition: (_) @condition
                            consequence: (block
                              "{"
                              .
                              [(line_comment) (block_comment)]*
                              .
                              [
                                (expression_statement
                                  (call_expression
                                    function: (field_expression
                                      value: (identifier) @pushed
                                      field: (field_identifier) @push)
                                    arguments: (arguments (_))))
                                (call_expression
                                  function: (field_expression
                                    value: (identifier) @pushed
                                    field: (field_identifier) @push)
                                  arguments: (arguments (_)))
                              ]
                              .
                              [(line_comment) (block_comment)]*
                              .
                              "}")
                            !alternative))
                      ]
                      .
                      [(line_comment) (block_comment)]*
                      .
                      "}") @body))
                (#eq? @vec_type "Vec")
                (#any-of? @constructor "new" "with_capacity")
                (#eq? @vec_macro "vec")
                (#eq? @vec_tokens "[]")
                (#eq? @push "push")
                (#eq? @pushed @collection)
                (#not-match? @body "\\.await|#!?\\[|\\b(break|continue|return)\\b")
                (#not-match? @body "\\.(contains|first|last|last_mut|len|is_empty|get|iter|binary_search)\\(")
                (#not-match? @condition "\\?"))

  # Catch a `for` loop that searches for one item by assigning it and breaking:
  #   let mut found = None;  for x in xs { if p(x) { found = Some(x); break; } }
  # Also matches the `bool` form (`let mut found = false;` and
  # `found = true;`), and `if let` conditions. Those become `.find(..)`,
  # `.find_map(..)`, `.position(..)`, or `.any(..)`. As in the push-loop rule,
  # the `.` anchors require the loop to be the statement right after the
  # `let`, the loop body to be only the `if`, and the `if` block to be only the
  # assignment followed by a plain `break`. Comments may sit between them, and
  # the query also matches an Edit snippet without a function.
  #
  # Limits: it does not match `while`/`loop`, an `else` branch, other
  # statements in the loop or the `if` block, `break 'label`, or other
  # statements between the `let` and the loop. It skips loops a closure cannot
  # express: `.await`, `continue`/`return`, or `?` in the condition or the
  # assigned value (a `find` closure returns `bool`), and attributes in the
  # body, since `#[cfg(..)]` may remove the assignment. Those checks are text
  # matches, so a string literal containing `?` also skips the loop. It still
  # matches when the variable is assigned again after the loop (the message
  # says to keep `mut`). A sweep of 604 crates found 3 matches, all clean
  # rewrites.
  - name: prefer-find-over-search-loop
    description: Search with find, find_map, position, or any instead of a for loop that assigns and breaks
    message: "Set `{{ $found }}` with an iterator search over `{{ $iterable }}` instead of a `for` loop that assigns it and breaks (`.find(..)` to keep the item, `.find_map(..)` for a derived value, `.position(..)` for an index, or `.any(..)` for a `bool`; keep `mut` only if you assign it again later), then retry."
    on:
      - hook: PreToolUse
        tool: Write
        file: "**/*.rs"
        content:
          - kind: SyntaxTree
            language: rust
            query: |
              (
                (let_declaration
                  (mutable_specifier)
                  pattern: (identifier) @found
                  value: [
                    (identifier) @none
                    (boolean_literal) @false
                  ])
                .
                [(line_comment) (block_comment)]*
                .
                (expression_statement
                  (for_expression
                    value: (_) @iterable
                    body: (block
                      "{"
                      .
                      [(line_comment) (block_comment)]*
                      .
                      (expression_statement
                        (if_expression
                          condition: (_) @condition
                          consequence: (block
                            "{"
                            .
                            [(line_comment) (block_comment)]*
                            .
                            (expression_statement
                              (assignment_expression
                                left: (identifier) @assigned
                                right: [
                                  (call_expression
                                    function: (identifier) @some
                                    arguments: (arguments (_) @value))
                                  (boolean_literal) @true
                                ]))
                            .
                            [(line_comment) (block_comment)]*
                            .
                            [
                              (expression_statement (break_expression) @break)
                              (break_expression) @break
                            ]
                            .
                            [(line_comment) (block_comment)]*
                            .
                            "}")
                          !alternative))
                      .
                      [(line_comment) (block_comment)]*
                      .
                      "}") @body))
                (#eq? @none "None")
                (#eq? @false "false")
                (#eq? @some "Some")
                (#eq? @true "true")
                (#eq? @break "break")
                (#eq? @assigned @found)
                (#not-match? @body "#!?\\[")
                (#not-match? @condition "\\.await|\\b(continue|return)\\b|\\?")
                (#not-match? @value "\\.await|\\b(continue|return)\\b|\\?"))
      - hook: PreToolUse
        tool: Edit
        file: "**/*.rs"
        new_content:
          - kind: SyntaxTree
            language: rust
            query: |
              (
                (let_declaration
                  (mutable_specifier)
                  pattern: (identifier) @found
                  value: [
                    (identifier) @none
                    (boolean_literal) @false
                  ])
                .
                [(line_comment) (block_comment)]*
                .
                (expression_statement
                  (for_expression
                    value: (_) @iterable
                    body: (block
                      "{"
                      .
                      [(line_comment) (block_comment)]*
                      .
                      (expression_statement
                        (if_expression
                          condition: (_) @condition
                          consequence: (block
                            "{"
                            .
                            [(line_comment) (block_comment)]*
                            .
                            (expression_statement
                              (assignment_expression
                                left: (identifier) @assigned
                                right: [
                                  (call_expression
                                    function: (identifier) @some
                                    arguments: (arguments (_) @value))
                                  (boolean_literal) @true
                                ]))
                            .
                            [(line_comment) (block_comment)]*
                            .
                            [
                              (expression_statement (break_expression) @break)
                              (break_expression) @break
                            ]
                            .
                            [(line_comment) (block_comment)]*
                            .
                            "}")
                          !alternative))
                      .
                      [(line_comment) (block_comment)]*
                      .
                      "}") @body))
                (#eq? @none "None")
                (#eq? @false "false")
                (#eq? @some "Some")
                (#eq? @true "true")
                (#eq? @break "break")
                (#eq? @assigned @found)
                (#not-match? @body "#!?\\[")
                (#not-match? @condition "\\.await|\\b(continue|return)\\b|\\?")
                (#not-match? @value "\\.await|\\b(continue|return)\\b|\\?"))
